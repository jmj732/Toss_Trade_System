name: trade-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trade
      POSTGRES_USER: trade
      # Optional here (not :?required) so compose.staging.yaml can supply
      # POSTGRES_PASSWORD_FILE instead — the official postgres image entrypoint rejects
      # having both a value and a _FILE set. Every other caller (local dev, mock, CI,
      # the drill scripts) always sets POSTGRES_PASSWORD explicitly, so this is a no-op
      # for them; postgres's own entrypoint still fails fast if neither is provided.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trade -d trade"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    stop_grace_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    stop_grace_period: 10s

  analysis:
    build: ./analysis-service
    ports:
      - "127.0.0.1:${ANALYSIS_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/internal/v1/ready', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    stop_grace_period: 10s

  backend:
    build: ./trading-backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/trade
      DATABASE_USERNAME: trade
      # Optional here (not :?required) so compose.staging.yaml can supply the real
      # password only via spring.datasource.password through Spring's Config Tree
      # feature instead. Every other caller sets POSTGRES_PASSWORD explicitly, so this
      # is a no-op for them.
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      ANALYSIS_SERVICE_BASE_URL: http://analysis:8000
      ANALYSIS_SERVICE_CONNECT_TIMEOUT: ${ANALYSIS_CONNECT_TIMEOUT:-PT2S}
      ANALYSIS_SERVICE_READ_TIMEOUT: ${ANALYSIS_READ_TIMEOUT:-PT5S}
      BROKER_CREDENTIALS_ENABLED: "false"
      PREDICTION_EVALUATION_ENABLED: ${PREDICTION_EVALUATION_ENABLED:-false}
      PREDICTION_EVALUATION_INTERVAL: ${PREDICTION_EVALUATION_INTERVAL:-PT1H}
      PREDICTION_EVALUATION_INITIAL_DELAY: ${PREDICTION_EVALUATION_INITIAL_DELAY:-PT1M}
      PREDICTION_EVALUATION_LOCK_TTL: ${PREDICTION_EVALUATION_LOCK_TTL:-PT10M}
      PREDICTION_EVALUATION_BATCH_SIZE: ${PREDICTION_EVALUATION_BATCH_SIZE:-100}
      PREDICTION_EVALUATION_MAX_PER_TICK: ${PREDICTION_EVALUATION_MAX_PER_TICK:-1000}
      PREDICTION_EVALUATION_MAX_RUNTIME: ${PREDICTION_EVALUATION_MAX_RUNTIME:-PT5M}
      PREDICTION_EVALUATION_METRICS_CACHE_TTL: ${PREDICTION_EVALUATION_METRICS_CACHE_TTL:-PT30S}
      NOTIFICATION_OUTBOX_ENABLED: ${NOTIFICATION_OUTBOX_ENABLED:-false}
      NOTIFICATION_OUTBOX_INTERVAL: ${NOTIFICATION_OUTBOX_INTERVAL:-PT2S}
      NOTIFICATION_OUTBOX_INITIAL_DELAY: ${NOTIFICATION_OUTBOX_INITIAL_DELAY:-PT2S}
      NOTIFICATION_OUTBOX_BATCH_SIZE: ${NOTIFICATION_OUTBOX_BATCH_SIZE:-50}
      ORDER_OUTBOX_ENABLED: ${ORDER_OUTBOX_ENABLED:-false}
      ORDER_OUTBOX_INTERVAL: ${ORDER_OUTBOX_INTERVAL:-PT2S}
      ORDER_OUTBOX_INITIAL_DELAY: ${ORDER_OUTBOX_INITIAL_DELAY:-PT2S}
      ORDER_OUTBOX_BATCH_SIZE: ${ORDER_OUTBOX_BATCH_SIZE:-50}
      ORDER_OUTBOX_MAX_ATTEMPTS: ${ORDER_OUTBOX_MAX_ATTEMPTS:-5}
      PREDICTION_INGESTION_API_KEY_RATE_LIMIT_LIMIT: ${PREDICTION_INGESTION_API_KEY_RATE_LIMIT_LIMIT:-60}
      PREDICTION_INGESTION_API_KEY_RATE_LIMIT_WINDOW: ${PREDICTION_INGESTION_API_KEY_RATE_LIMIT_WINDOW:-PT1M}
      PREDICTION_INGESTION_API_KEY_CLEANUP_ENABLED: ${PREDICTION_INGESTION_API_KEY_CLEANUP_ENABLED:-true}
      PREDICTION_INGESTION_API_KEY_CLEANUP_INTERVAL: ${PREDICTION_INGESTION_API_KEY_CLEANUP_INTERVAL:-PT1H}
      PREDICTION_INGESTION_API_KEY_CLEANUP_INITIAL_DELAY: ${PREDICTION_INGESTION_API_KEY_CLEANUP_INITIAL_DELAY:-PT1M}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus
      SERVER_SHUTDOWN: graceful
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      analysis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    stop_grace_period: 20s

  dashboard:
    build:
      context: ./web-dashboard
      args:
        BACKEND_URL: http://backend:8080
    environment:
      BACKEND_URL: http://backend:8080
      OIDC_REGISTRATION_ID: oidc
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    stop_grace_period: 10s

volumes:
  postgres-data:
  redis-data:
