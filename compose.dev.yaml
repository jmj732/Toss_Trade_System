services:
  backend:
    environment:
      BROKER_CREDENTIALS_ENABLED: "true"
      BROKER_CREDENTIALS_ACTIVE_KEY_VERSION: 1
      BROKER_CREDENTIALS_KEYS_1: ${CREDENTIAL_KEY_BASE64:?set CREDENTIAL_KEY_BASE64 in .env}
      BROKER_TOSS_BASE_URL: ${TOSS_BASE_URL:?set TOSS_BASE_URL in .env}
      BROKER_TOSS_CONNECT_TIMEOUT: ${TOSS_CONNECT_TIMEOUT:-PT2S}
      BROKER_TOSS_READ_TIMEOUT: ${TOSS_READ_TIMEOUT:-PT5S}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?set OIDC_CLIENT_ID in .env}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET in .env}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_OIDC_CLIENT_AUTHENTICATION_METHOD: client_secret_basic
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_OIDC_AUTHORIZATION_GRANT_TYPE: authorization_code
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_OIDC_REDIRECT_URI: "${PUBLIC_DASHBOARD_URL:-http://localhost:3000}/login/oauth2/code/{registrationId}"
      PUBLIC_DASHBOARD_URL: "${PUBLIC_DASHBOARD_URL:-http://localhost:3000}"
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_OIDC_SCOPE: openid,profile,email
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_OIDC_PROVIDER: oidc
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:?set OIDC_ISSUER_URI in .env}
