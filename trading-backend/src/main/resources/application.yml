spring:
  application:
    name: trading-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/trade}
    username: ${DATABASE_USERNAME:trade}
    password: ${DATABASE_PASSWORD:trade}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
security:
  access-token-signing-secret: ${AUTH_TOKEN_SIGNING_SECRET:}
  access-token-ttl: ${ACCESS_TOKEN_TTL:PT20M}
  refresh-token-ttl: ${REFRESH_TOKEN_TTL:P7D}
public:
  dashboard-url: ${PUBLIC_DASHBOARD_URL:http://localhost:3000}
real-order:
  enabled: ${REAL_ORDER_ENABLED:false}
connector:
  mcp:
    default-scope: ${CONNECTOR_MCP_DEFAULT_SCOPE:connector:read}
stock-analysis:
  running-timeout: ${STOCK_ANALYSIS_RUNNING_TIMEOUT:PT5M}
  # Enabling a provider requires its base-url, path, fields, and provider policy
  # under stock-analysis.providers.<id>; disabled entries construct no HTTP client.
  providers:
    toss:
      enabled: ${STOCK_ANALYSIS_TOSS_ENABLED:false}
    sec:
      enabled: ${STOCK_ANALYSIS_SEC_ENABLED:false}
    fred:
      enabled: ${STOCK_ANALYSIS_FRED_ENABLED:false}
    bls:
      enabled: ${STOCK_ANALYSIS_BLS_ENABLED:false}
    bea:
      enabled: ${STOCK_ANALYSIS_BEA_ENABLED:false}
    fed:
      enabled: ${STOCK_ANALYSIS_FED_ENABLED:false}
    fmp:
      enabled: ${STOCK_ANALYSIS_FMP_ENABLED:false}
    finnhub:
      enabled: ${STOCK_ANALYSIS_FINNHUB_ENABLED:false}
    polygon:
      enabled: ${STOCK_ANALYSIS_POLYGON_ENABLED:false}
    twelve-data:
      enabled: ${STOCK_ANALYSIS_TWELVE_DATA_ENABLED:false}
production:
  readiness:
    max-data-age: ${PRODUCTION_READINESS_MAX_DATA_AGE:PT15M}
portfolio:
  snapshot:
    max-age: ${PORTFOLIO_SNAPSHOT_MAX_AGE:PT15M}
investment-os:
  sheet:
    enabled: ${INVESTMENT_OS_SHEET_ENABLED:false}
    spreadsheet-id: ${GOOGLE_SHEETS_SPREADSHEET_ID:14GkxnY1zubBjTwtp2NB7pSDFJ4TKeYj3_3YVBzMzBQY}
    user-id: ${INVESTMENT_OS_SHEET_USER_ID:}
    connection-id: ${INVESTMENT_OS_SHEET_CONNECTION_ID:}
    account-label: ${INVESTMENT_OS_SHEET_ACCOUNT_LABEL:ACCOUNT_2}
    service-account-json: ${GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON:}
    interval: ${INVESTMENT_OS_SHEET_INTERVAL:PT5M}
    initial-delay: ${INVESTMENT_OS_SHEET_INITIAL_DELAY:PT1M}
    lock-ttl: ${INVESTMENT_OS_SHEET_LOCK_TTL:PT10M}
market-events:
  scheduler:
    enabled: ${MARKET_EVENTS_SCHEDULER_ENABLED:false}
  interval: ${MARKET_EVENTS_INTERVAL:PT15M}
  initial-delay: ${MARKET_EVENTS_INITIAL_DELAY:PT1M}
  lease-ttl: ${MARKET_EVENTS_LEASE_TTL:PT10M}
  stale-after: ${MARKET_EVENTS_STALE_AFTER:PT30M}
  lookback: ${MARKET_EVENTS_LOOKBACK:P2D}
  retry-backoff: ${MARKET_EVENTS_RETRY_BACKOFF:PT30S}
  max-retry-backoff: ${MARKET_EVENTS_MAX_RETRY_BACKOFF:PT30M}
  max-attempts: ${MARKET_EVENTS_MAX_ATTEMPTS:3}
  batch-size: ${MARKET_EVENTS_BATCH_SIZE:25}
  max-events-per-provider: ${MARKET_EVENTS_MAX_EVENTS_PER_PROVIDER:200}
  providers:
    sec:
      enabled: ${MARKET_EVENTS_SEC_ENABLED:false}
    ir:
      enabled: ${MARKET_EVENTS_IR_ENABLED:false}
    fed:
      enabled: ${MARKET_EVENTS_FED_ENABLED:false}
    fred:
      enabled: ${MARKET_EVENTS_FRED_ENABLED:false}
    bls:
      enabled: ${MARKET_EVENTS_BLS_ENABLED:false}
    bea:
      enabled: ${MARKET_EVENTS_BEA_ENABLED:false}
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis,analysisService
  health:
    readinessstate:
      enabled: true
logging:
  structured:
    format:
      console: ${LOG_STRUCTURED_FORMAT:ecs}
