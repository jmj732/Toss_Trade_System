name: CI Analysis

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  fastapi-analysis:
    name: FastAPI analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: analysis-service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analysis-service/pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[test]"
      - name: pytest
        run: pytest -q --junitxml=pytest-results.xml
      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fastapi-analysis-pytest-results
          path: analysis-service/pytest-results.xml
          if-no-files-found: ignore
          retention-days: 14
