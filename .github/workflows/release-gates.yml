name: Release Gates

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  spring-backend:
    name: Spring backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: trading-backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvnw clean verify
        run: ./mvnw --no-transfer-progress clean verify
      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: spring-backend-surefire-reports
          path: trading-backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

  fastapi-analysis:
    name: FastAPI analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: analysis-service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analysis-service/pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[test]"
      - name: pytest
        run: pytest -q --junitxml=pytest-results.xml
      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fastapi-analysis-pytest-results
          path: analysis-service/pytest-results.xml
          if-no-files-found: ignore
          retention-days: 14

  nextjs-dashboard:
    name: Next.js dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-dashboard/package-lock.json
      - name: npm ci
        run: npm ci
      - name: npm test
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log
      - name: npm run build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build-output.log
      - name: Upload test and build logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nextjs-dashboard-logs
          path: |
            web-dashboard/test-output.log
            web-dashboard/build-output.log
          if-no-files-found: ignore
          retention-days: 14

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web-dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-dashboard/package-lock.json
      - name: npm ci
        run: npm ci
      - name: npm audit
        run: npm audit --omit=dev

  compose-smoke:
    name: Compose mock-stack smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: local-stack contract
        run: |
          set -o pipefail
          ./scripts/test-local-stack.sh 2>&1 | tee contract-output.log
      - name: local-stack smoke
        run: |
          set -o pipefail
          ./scripts/smoke-local-stack.sh 2>&1 | tee smoke-output.log
      - name: Upload compose smoke logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: compose-smoke-logs
          path: |
            contract-output.log
            smoke-output.log
          if-no-files-found: ignore
          retention-days: 14

  backend-cd:
    name: Deploy Spring backend
    if: >-
      github.ref == 'refs/heads/design/modular-monolith-architecture' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs:
      - spring-backend
      - fastapi-analysis
      - nextjs-dashboard
      - npm-audit
      - compose-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: backend-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Build backend image
        env:
          IMAGE_TAG: trade-backend:${{ github.sha }}
        run: docker build --pull --tag "$IMAGE_TAG" trading-backend

      - name: Build analysis and dashboard images
        env:
          ANALYSIS_IMAGE: trade-analysis:${{ github.sha }}
          DASHBOARD_IMAGE: trade-dashboard:${{ github.sha }}
        run: |
          docker build --pull --tag "$ANALYSIS_IMAGE" analysis-service
          docker build --pull --tag "$DASHBOARD_IMAGE" \
            --build-arg BACKEND_URL=http://backend:8080 web-dashboard

      - name: Stream image and deploy over pinned SSH
        env:
          IMAGE_TAG: trade-backend:${{ github.sha }}
          ANALYSIS_IMAGE: trade-analysis:${{ github.sha }}
          DASHBOARD_IMAGE: trade-dashboard:${{ github.sha }}
          BACKEND_DEPLOY_HOST: ${{ secrets.BACKEND_DEPLOY_HOST }}
          BACKEND_DEPLOY_PORT: ${{ secrets.BACKEND_DEPLOY_PORT }}
          BACKEND_DEPLOY_USER: ${{ secrets.BACKEND_DEPLOY_USER }}
          BACKEND_DEPLOY_PATH: ${{ secrets.BACKEND_DEPLOY_PATH }}
          BACKEND_DEPLOY_SSH_KEY: ${{ secrets.BACKEND_DEPLOY_SSH_KEY }}
          BACKEND_DEPLOY_KNOWN_HOSTS: ${{ secrets.BACKEND_DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail

          : "${BACKEND_DEPLOY_HOST:?missing BACKEND_DEPLOY_HOST}"
          : "${BACKEND_DEPLOY_PORT:?missing BACKEND_DEPLOY_PORT}"
          : "${BACKEND_DEPLOY_USER:?missing BACKEND_DEPLOY_USER}"
          : "${BACKEND_DEPLOY_PATH:?missing BACKEND_DEPLOY_PATH}"
          : "${BACKEND_DEPLOY_SSH_KEY:?missing BACKEND_DEPLOY_SSH_KEY}"
          : "${BACKEND_DEPLOY_KNOWN_HOSTS:?missing BACKEND_DEPLOY_KNOWN_HOSTS}"

          key_file="$(mktemp)"
          known_hosts_file="$(mktemp)"
          trap 'rm -f "$key_file" "$known_hosts_file"' EXIT
          umask 077
          printf '%s\n' "$BACKEND_DEPLOY_SSH_KEY" >"$key_file"
          printf '%s\n' "$BACKEND_DEPLOY_KNOWN_HOSTS" >"$known_hosts_file"

          ssh_args=(
            -i "$key_file"
            -p "$BACKEND_DEPLOY_PORT"
            -o BatchMode=yes
            -o ConnectTimeout=30
            -o IdentitiesOnly=yes
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=10
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$known_hosts_file"
          )

          prune_unused_trade_images() {
            ssh "${ssh_args[@]}" "$BACKEND_DEPLOY_USER@$BACKEND_DEPLOY_HOST" 'bash -s' <<'CLEANUP'
          set -euo pipefail
          container_image_ids="$(docker ps -aq | while IFS= read -r container_id; do
            docker inspect --format '{{.Image}}' "$container_id"
          done)"
          docker image ls --format '{{.Repository}}:{{.Tag}}' |
            awk '/^trade-(backend|analysis|dashboard):/ { print }' |
            while IFS= read -r image; do
              image_id="$(docker image inspect --format '{{.Id}}' "$image")"
              if grep -Fqx "$image_id" <<<"$container_image_ids"; then
                printf 'keeping container image %s\n' "$image"
              else
                printf 'removing unused image %s\n' "$image"
                # ponytail: retain untagged parents; restore normal prune after daemon GC is healthy.
                docker image rm --no-prune "$image"
              fi
            done
          CLEANUP
          }

          prune_unused_trade_images

          stream_image() {
            local image="$1"
            local image_name="${image//:/_}"
            local archive_dir
            local remote_archive

            archive_dir="$(mktemp -d)"
            remote_archive="$(printf '%q' "$BACKEND_DEPLOY_PATH/.${GITHUB_SHA}-${image_name}.tar.gz")"
            printf 'streaming %s\n' "$image"
            docker save "$image" | gzip -1 -c >"$archive_dir/image.tar.gz"
            split -b 32m -d --additional-suffix=.part \
              "$archive_dir/image.tar.gz" "$archive_dir/part-"

            ssh "${ssh_args[@]}" "$BACKEND_DEPLOY_USER@$BACKEND_DEPLOY_HOST" \
              "rm -f $remote_archive"
            for part in "$archive_dir"/part-*.part; do
              printf 'uploading %s\n' "$(basename "$part")"
              ssh "${ssh_args[@]}" "$BACKEND_DEPLOY_USER@$BACKEND_DEPLOY_HOST" \
                "cat >> $remote_archive" <"$part"
            done
            ssh "${ssh_args[@]}" "$BACKEND_DEPLOY_USER@$BACKEND_DEPLOY_HOST" \
              "gzip -d < $remote_archive | docker load; rm -f $remote_archive"
            rm -rf -- "$archive_dir"
          }

          stream_image "$IMAGE_TAG"
          stream_image "$ANALYSIS_IMAGE"
          stream_image "$DASHBOARD_IMAGE"

          remote_path="$(printf '%q' "$BACKEND_DEPLOY_PATH")"
          remote_image="$(printf '%q' "$IMAGE_TAG")"
          remote_analysis_image="$(printf '%q' "$ANALYSIS_IMAGE")"
          remote_dashboard_image="$(printf '%q' "$DASHBOARD_IMAGE")"
          # The quoted path is intentionally expanded locally into the remote command.
          # shellcheck disable=SC2029
          tar -czf - compose.yaml compose.staging.yaml compose.staging.credentialed.yaml |
            ssh "${ssh_args[@]}" "$BACKEND_DEPLOY_USER@$BACKEND_DEPLOY_HOST" \
              "mkdir -p $remote_path && tar -xzf - -C $remote_path"

          # The quoted values are intentionally expanded locally into the remote command.
          # shellcheck disable=SC2029
          ssh "${ssh_args[@]}" "$BACKEND_DEPLOY_USER@$BACKEND_DEPLOY_HOST" \
            "DEPLOY_PATH=$remote_path IMAGE_TAG=$remote_image ANALYSIS_IMAGE=$remote_analysis_image DASHBOARD_IMAGE=$remote_dashboard_image bash -s" <<'REMOTE'
          set -euo pipefail
          cd -- "$DEPLOY_PATH"
          export PATH="$HOME/bin:$PATH"
          command -v doppler >/dev/null 2>&1 || {
            echo "Doppler CLI is required at $HOME/bin/doppler or on PATH" >&2
            exit 1
          }
          doppler run --project trade --config stg -- env \
            BACKEND_IMAGE="$IMAGE_TAG" \
            ANALYSIS_IMAGE="$ANALYSIS_IMAGE" \
            DASHBOARD_IMAGE="$DASHBOARD_IMAGE" \
            docker compose \
              -f compose.yaml \
              -f compose.staging.yaml \
              -f compose.staging.credentialed.yaml \
              up -d --wait migrate backend
          curl -fsS http://127.0.0.1:8080/actuator/health/readiness >/dev/null
          REMOTE
