name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Spring backend and dashboard
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: trading-backend
          pull: true
          load: true
          tags: trade-backend:${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=cd-backend
          cache-to: type=gha,scope=cd-backend,mode=max,ignore-error=true

      - name: Build analysis image
        uses: docker/build-push-action@v7
        with:
          context: analysis-service
          pull: true
          load: true
          tags: trade-analysis:${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=cd-analysis
          cache-to: type=gha,scope=cd-analysis,mode=max,ignore-error=true

      - name: Build dashboard image
        uses: docker/build-push-action@v7
        with:
          context: web-dashboard
          pull: true
          load: true
          tags: trade-dashboard:${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=cd-dashboard
          cache-to: type=gha,scope=cd-dashboard,mode=max,ignore-error=true
          build-args: BACKEND_URL=http://backend:8080

      - name: Build EV-1 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: scripts/ev1/Dockerfile
          pull: true
          load: true
          tags: trade-ev1:${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=cd-ev1
          cache-to: type=gha,scope=cd-ev1,mode=max,ignore-error=true

      - name: Stream image and deploy over pinned SSH
        env:
          IMAGE_TAG: trade-backend:${{ env.DEPLOY_SHA }}
          ANALYSIS_IMAGE: trade-analysis:${{ env.DEPLOY_SHA }}
          DASHBOARD_IMAGE: trade-dashboard:${{ env.DEPLOY_SHA }}
          EV1_IMAGE: trade-ev1:${{ env.DEPLOY_SHA }}
          BACKEND_DEPLOY_HOST: ${{ secrets.BACKEND_DEPLOY_HOST }}
          BACKEND_DEPLOY_PORT: ${{ secrets.BACKEND_DEPLOY_PORT }}
          BACKEND_DEPLOY_USER: ${{ secrets.BACKEND_DEPLOY_USER }}
          BACKEND_DEPLOY_PATH: ${{ secrets.BACKEND_DEPLOY_PATH }}
          BACKEND_DEPLOY_SSH_KEY: ${{ secrets.BACKEND_DEPLOY_SSH_KEY }}
          BACKEND_DEPLOY_KNOWN_HOSTS: ${{ secrets.BACKEND_DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail

          : "${BACKEND_DEPLOY_HOST:?missing BACKEND_DEPLOY_HOST}"
          : "${BACKEND_DEPLOY_PORT:?missing BACKEND_DEPLOY_PORT}"
          : "${BACKEND_DEPLOY_USER:?missing BACKEND_DEPLOY_USER}"
          : "${BACKEND_DEPLOY_PATH:?missing BACKEND_DEPLOY_PATH}"
          : "${BACKEND_DEPLOY_SSH_KEY:?missing BACKEND_DEPLOY_SSH_KEY}"
          : "${BACKEND_DEPLOY_KNOWN_HOSTS:?missing BACKEND_DEPLOY_KNOWN_HOSTS}"

          key_file="$(mktemp)"
          known_hosts_file="$(mktemp)"
          trap 'rm -f "$key_file" "$known_hosts_file"' EXIT
          umask 077
          printf '%s\n' "$BACKEND_DEPLOY_SSH_KEY" >"$key_file"
          printf '%s\n' "$BACKEND_DEPLOY_KNOWN_HOSTS" >"$known_hosts_file"

          ssh_args=(
            -i "$key_file"
            -p "$BACKEND_DEPLOY_PORT"
            -o BatchMode=yes
            -o ConnectTimeout=30
            -o IdentitiesOnly=yes
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=10
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$known_hosts_file"
          )

          source scripts/cd-image-reuse.sh

          cleanup_path="$(printf '%q' "$BACKEND_DEPLOY_PATH")"
          prune_unused_images() {
            # shellcheck disable=SC2029
            ssh "${ssh_args[@]}" "$BACKEND_DEPLOY_USER@$BACKEND_DEPLOY_HOST" \
              "BACKEND_DEPLOY_PATH=$cleanup_path bash -s" <<'CLEANUP'
          set -euo pipefail
          find -- "$BACKEND_DEPLOY_PATH" -maxdepth 1 -type f \
            \( \
              -name '.[0-9a-f]*-trade-backend_*.tar.gz' -o \
              -name '.[0-9a-f]*-trade-analysis_*.tar.gz' -o \
              -name '.[0-9a-f]*-trade-dashboard_*.tar.gz' -o \
              -name '.[0-9a-f]*-trade-ev1_*.tar.gz' \
            \) -delete
          container_image_refs="$(docker ps -aq | while IFS= read -r container_id; do
            docker inspect --format '{{.Config.Image}}' "$container_id"
          done)"
          docker image ls --format '{{.Repository}}:{{.Tag}}' |
            awk '/^trade-(backend|analysis|dashboard|ev1):/ { print }' |
            while IFS= read -r image; do
              if grep -Fqx "$image" <<<"$container_image_refs"; then
                printf 'keeping container image %s\n' "$image"
              else
                printf 'removing unused image %s\n' "$image"
                docker image rm "$image"
              fi
            done
          CLEANUP
          }

          cleanup_on_exit() {
            local exit_status=$?
            if ! prune_unused_images; then
              printf 'image cleanup failed; refusing a clean deploy result\n' >&2
              exit_status=1
            fi
            rm -f "$key_file" "$known_hosts_file" || exit_status=1
            exit "$exit_status"
          }
          trap cleanup_on_exit EXIT
          trap 'exit 143' INT TERM

          prune_unused_images

          stream_image() {
            local image="$1"
            if reuse_remote_image "$image"; then return 0; fi
            local image_name="${image//:/_}"
            local archive_dir
            local remote_archive

            archive_dir="$(mktemp -d)"
            remote_archive="$(printf '%q' "$BACKEND_DEPLOY_PATH/.${DEPLOY_SHA}-${image_name}.tar.gz")"
            printf 'streaming %s\n' "$image"
            docker save "$image" | gzip -1 -c >"$archive_dir/image.tar.gz"
            split -b 32m -d --additional-suffix=.part \
              "$archive_dir/image.tar.gz" "$archive_dir/part-"

            # shellcheck disable=SC2029
            ssh "${ssh_args[@]}" "$BACKEND_DEPLOY_USER@$BACKEND_DEPLOY_HOST" \
              "rm -f $remote_archive"
            for part in "$archive_dir"/part-*.part; do
              printf 'uploading %s\n' "$(basename "$part")"
              # shellcheck disable=SC2029
              ssh "${ssh_args[@]}" "$BACKEND_DEPLOY_USER@$BACKEND_DEPLOY_HOST" \
                "cat >> $remote_archive" <"$part"
            done
            # shellcheck disable=SC2029
            ssh "${ssh_args[@]}" "$BACKEND_DEPLOY_USER@$BACKEND_DEPLOY_HOST" \
              "gzip -d < $remote_archive | docker load; rm -f $remote_archive"
            rm -rf -- "$archive_dir"
          }

          stream_image "$IMAGE_TAG"
          stream_image "$ANALYSIS_IMAGE"
          stream_image "$DASHBOARD_IMAGE"
          stream_image "$EV1_IMAGE"

          remote_path="$(printf '%q' "$BACKEND_DEPLOY_PATH")"
          remote_image="$(printf '%q' "$IMAGE_TAG")"
          remote_analysis_image="$(printf '%q' "$ANALYSIS_IMAGE")"
          remote_dashboard_image="$(printf '%q' "$DASHBOARD_IMAGE")"
          remote_ev1_image="$(printf '%q' "$EV1_IMAGE")"
          # The quoted path is intentionally expanded locally into the remote command.
          # shellcheck disable=SC2029
          tar -czf - compose.yaml compose.staging.yaml compose.staging.credentialed.yaml |
            ssh "${ssh_args[@]}" "$BACKEND_DEPLOY_USER@$BACKEND_DEPLOY_HOST" \
              "mkdir -p $remote_path && tar -xzf - -C $remote_path"

          # The quoted values are intentionally expanded locally into the remote command.
          # shellcheck disable=SC2029
          ssh "${ssh_args[@]}" "$BACKEND_DEPLOY_USER@$BACKEND_DEPLOY_HOST" \
            "DEPLOY_PATH=$remote_path IMAGE_TAG=$remote_image ANALYSIS_IMAGE=$remote_analysis_image DASHBOARD_IMAGE=$remote_dashboard_image EV1_IMAGE=$remote_ev1_image bash -s" <<'REMOTE'
          set -euo pipefail
          cd -- "$DEPLOY_PATH"
          export PATH="$HOME/bin:$PATH"
          command -v doppler >/dev/null 2>&1 || {
            echo "Doppler CLI is required at $HOME/bin/doppler or on PATH" >&2
            exit 1
          }
          if ! doppler run --project trade --config stg -- env \
            BACKEND_IMAGE="$IMAGE_TAG" \
            ANALYSIS_IMAGE="$ANALYSIS_IMAGE" \
            DASHBOARD_IMAGE="$DASHBOARD_IMAGE" \
            EV1_IMAGE="$EV1_IMAGE" \
            docker compose \
              -f compose.yaml \
              -f compose.staging.yaml \
              -f compose.staging.credentialed.yaml \
              --profile ev1 \
              up --no-build -d --wait migrate backend dashboard ev1; then
            echo 'EV-1 deployment failed; collecting non-secret Compose diagnostics' >&2
            doppler run --project trade --config stg -- env EV1_IMAGE="$EV1_IMAGE" \
              docker compose -f compose.yaml -f compose.staging.yaml -f compose.staging.credentialed.yaml \
                --profile ev1 ps -a || true
            doppler run --project trade --config stg -- env EV1_IMAGE="$EV1_IMAGE" \
              docker compose -f compose.yaml -f compose.staging.yaml -f compose.staging.credentialed.yaml \
                --profile ev1 logs --no-color --tail=300 ev1 || true
            ev1_container_id="$(doppler run --project trade --config stg -- env EV1_IMAGE="$EV1_IMAGE" \
              docker compose -f compose.yaml -f compose.staging.yaml -f compose.staging.credentialed.yaml \
                --profile ev1 ps -aq ev1 || true)"
            if [[ -n "$ev1_container_id" ]]; then
              docker inspect --format 'EV-1 state: OOMKilled={{.State.OOMKilled}} ExitCode={{.State.ExitCode}} Status={{.State.Status}}' \
                "$ev1_container_id" || true
            else
              echo 'EV-1 container state unavailable: no container found' >&2
            fi
            doppler run --project trade --config stg -- env EV1_IMAGE="$EV1_IMAGE" \
              docker compose -f compose.yaml -f compose.staging.yaml -f compose.staging.credentialed.yaml \
                --profile ev1 exec -T ev1 python3 /app/scripts/ev1-status.py \
                --manifest /var/lib/ev1/forward/manifest.json \
                --runner-status /var/lib/ev1/runner-health.json \
                --max-age-seconds "${EV1_MAX_AGE_SECONDS:-3600}" || true
            exit 1
          fi
          curl -fsS http://127.0.0.1:8080/actuator/health/readiness >/dev/null
          doppler run --project trade --config stg -- env EV1_IMAGE="$EV1_IMAGE" \
            docker compose -f compose.yaml -f compose.staging.yaml -f compose.staging.credentialed.yaml \
              --profile ev1 exec -T ev1 python3 /app/scripts/ev1-status.py \
              --manifest /var/lib/ev1/forward/manifest.json \
              --runner-status /var/lib/ev1/runner-health.json \
              --max-age-seconds "${EV1_MAX_AGE_SECONDS:-3600}"
          REMOTE

  deploy-vercel:
    name: Deploy dashboard to Vercel
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and deploy production dashboard
        working-directory: web-dashboard
        shell: bash
        run: |
          set -euo pipefail
          : "${VERCEL_TOKEN:?missing VERCEL_TOKEN}"
          : "${VERCEL_ORG_ID:?missing VERCEL_ORG_ID}"
          : "${VERCEL_PROJECT_ID:?missing VERCEL_PROJECT_ID}"

          npx --yes vercel@58.5.1 deploy --yes --prod \
            --project "$VERCEL_PROJECT_ID" \
            --token "$VERCEL_TOKEN"
