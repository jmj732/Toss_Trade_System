name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      analysis: ${{ steps.filter.outputs.analysis }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      stack: ${{ steps.filter.outputs.stack }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          all_true() {
            {
              echo "backend=true"
              echo "analysis=true"
              echo "dashboard=true"
              echo "stack=true"
            } >>"$GITHUB_OUTPUT"
          }

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "workflow_dispatch: running all jobs"
            all_true
            exit 0
          fi

          base="$BASE_SHA"
          if [ -z "$base" ] \
            || [ "$base" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "base commit unavailable ('$base'): running all jobs (fail-open)"
            all_true
            exit 0
          fi

          changed="$(git diff --name-only "$base" "$GITHUB_SHA")"
          echo "changed files:"
          echo "$changed"

          backend=false
          analysis=false
          dashboard=false
          stack=false

          if echo "$changed" | grep -Eq '^\.github/workflows/'; then
            echo "workflow files changed: running all jobs"
            all_true
            exit 0
          fi

          if echo "$changed" | grep -Eq '^(trading-backend/|contracts/)'; then
            backend=true
          fi
          if echo "$changed" | grep -Eq '^(analysis-service/|contracts/)'; then
            analysis=true
          fi
          if echo "$changed" | grep -Eq '^web-dashboard/'; then
            dashboard=true
          fi

          if [ "$backend" = "true" ] || [ "$analysis" = "true" ] || [ "$dashboard" = "true" ]; then
            stack=true
          fi
          if echo "$changed" | grep -Eq '^(compose[^/]*\.ya?ml|scripts/|mocks/)'; then
            stack=true
          fi

          {
            echo "backend=$backend"
            echo "analysis=$analysis"
            echo "dashboard=$dashboard"
            echo "stack=$stack"
          } >>"$GITHUB_OUTPUT"

  spring-backend:
    name: Spring backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: trading-backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvnw clean verify
        run: ./mvnw --no-transfer-progress clean verify
      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: spring-backend-surefire-reports
          path: trading-backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

  fastapi-analysis:
    name: FastAPI analysis
    needs: changes
    if: needs.changes.outputs.analysis == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: analysis-service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analysis-service/pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[test]"
      - name: pytest
        run: pytest -q --junitxml=pytest-results.xml
      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fastapi-analysis-pytest-results
          path: analysis-service/pytest-results.xml
          if-no-files-found: ignore
          retention-days: 14

  nextjs-dashboard:
    name: Next.js dashboard
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-dashboard/package-lock.json
      - name: npm ci
        run: npm ci
      - name: npm test
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log
      - name: npm run build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build-output.log
      - name: Upload test and build logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nextjs-dashboard-logs
          path: |
            web-dashboard/test-output.log
            web-dashboard/build-output.log
          if-no-files-found: ignore
          retention-days: 14

  npm-audit:
    name: npm audit
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web-dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-dashboard/package-lock.json
      - name: npm ci
        run: npm ci
      - name: npm audit
        run: npm audit --omit=dev

  compose-smoke:
    name: Compose mock-stack smoke
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: local-stack contract
        run: |
          set -o pipefail
          ./scripts/test-local-stack.sh 2>&1 | tee contract-output.log
      - name: local-stack smoke
        run: |
          set -o pipefail
          ./scripts/smoke-local-stack.sh 2>&1 | tee smoke-output.log
      - name: Upload compose smoke logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: compose-smoke-logs
          path: |
            contract-output.log
            smoke-output.log
          if-no-files-found: ignore
          retention-days: 14

  ci-gate:
    name: CI gate
    needs:
      - changes
      - spring-backend
      - fastapi-analysis
      - nextjs-dashboard
      - npm-audit
      - compose-smoke
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate gate results
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "needs results: $RESULTS"
          status=0
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "gate failing on result: $result"
                status=1
                ;;
            esac
          done
          exit "$status"
