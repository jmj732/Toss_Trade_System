name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      reuse: ${{ steps.verified.outputs.reuse }}
      backend: ${{ steps.filter.outputs.backend }}
      analysis: ${{ steps.filter.outputs.analysis }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      stack: ${{ steps.filter.outputs.stack }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify CI proof contract
        run: |
          python3 scripts/test-ci-verification.py
          python3 scripts/test-ci-change-filter.py
      - id: verified
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-verification.py check
      - id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        # Includes web-dashboard/ runtime changes; backend test-only changes need no image smoke.
        run: python3 scripts/ci-change-filter.py

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true' && needs.changes.outputs.reuse != 'true'
    uses: ./.github/workflows/ci-backend.yml

  analysis:
    name: Analysis
    needs: changes
    if: needs.changes.outputs.analysis == 'true' && needs.changes.outputs.reuse != 'true'
    uses: ./.github/workflows/ci-analysis.yml

  dashboard:
    name: Dashboard
    needs: changes
    if: needs.changes.outputs.dashboard == 'true' || needs.changes.outputs.reuse == 'true'
    uses: ./.github/workflows/ci-dashboard.yml
    with:
      run-build: ${{ needs.changes.outputs.reuse != 'true' }}

  stack:
    name: Stack
    needs: changes
    if: needs.changes.outputs.stack == 'true' && needs.changes.outputs.reuse != 'true'
    uses: ./.github/workflows/ci-stack.yml

  ci-gate:
    name: CI gate
    needs:
      - changes
      - backend
      - analysis
      - dashboard
      - stack
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Evaluate gate results
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "needs results: $RESULTS"
          status=0
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "gate failing on result: $result"
                status=1
                ;;
            esac
          done
          exit "$status"
      - name: Record successful verification
        env:
          VERIFIED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          JOB_RESULTS: >-
            {"changes":"${{ needs.changes.result }}","backend":"${{ needs.backend.result }}",
            "analysis":"${{ needs.analysis.result }}","dashboard":"${{ needs.dashboard.result }}",
            "stack":"${{ needs.stack.result }}"}
        run: python3 scripts/ci-verification.py write
      - uses: actions/upload-artifact@v6
        with:
          name: ci-verification
          path: verification.json
          retention-days: 2
