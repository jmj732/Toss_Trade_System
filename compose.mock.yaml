services:
  oidc-mock:
    image: ghcr.io/navikt/mock-oauth2-server:4.0.0
    hostname: host.docker.internal
    ports:
      - "127.0.0.1:${OIDC_MOCK_PORT:-9090}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/isalive >/dev/null"]
      interval: 3s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  toss-mock:
    image: wiremock/wiremock:3.13.2
    volumes:
      - ./mocks/toss:/home/wiremock:ro
    ports:
      - "127.0.0.1:${TOSS_MOCK_PORT:-9091}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/__admin/mappings >/dev/null"]
      interval: 3s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  backend:
    depends_on:
      oidc-mock:
        condition: service_healthy
      toss-mock:
        condition: service_healthy
    environment:
      BROKER_CREDENTIALS_ENABLED: "true"
      BROKER_CREDENTIALS_ACTIVE_KEY_VERSION: 1
      BROKER_CREDENTIALS_KEYS_1: ${CREDENTIAL_KEY_BASE64:?set CREDENTIAL_KEY_BASE64 in .env}
      BROKER_TOSS_BASE_URL: http://toss-mock:8080
      BROKER_TOSS_CONNECT_TIMEOUT: ${TOSS_CONNECT_TIMEOUT:-PT2S}
      BROKER_TOSS_READ_TIMEOUT: ${TOSS_READ_TIMEOUT:-PT5S}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_OIDC_CLIENT_ID: trade-local
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_OIDC_CLIENT_AUTHENTICATION_METHOD: none
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_OIDC_AUTHORIZATION_GRANT_TYPE: authorization_code
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_OIDC_REDIRECT_URI: "http://localhost:${DASHBOARD_PORT:-3000}/login/oauth2/code/{registrationId}"
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_OIDC_SCOPE: openid,profile,email
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_OIDC_PROVIDER: oidc
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_OIDC_ISSUER_URI: "http://host.docker.internal:${OIDC_MOCK_PORT:-9090}/default"
