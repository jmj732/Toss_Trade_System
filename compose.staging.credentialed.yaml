name: trade-staging-credentialed

# Opt-in real-provider overlay. Load with:
#   doppler run --project trade --config stg -- \
#     docker compose -f compose.yaml -f compose.staging.yaml \
#       -f compose.staging.credentialed.yaml up -d --wait
# Never layer compose.mock.yaml onto this file. Doppler supplies values; no secret is stored here.

services:
  backend:
    environment:
      # Enables encrypted Toss onboarding only. Client credentials arrive through the
      # authenticated /api/v1/broker-connections/toss request and are never env settings.
      BROKER_CREDENTIALS_ENABLED: "true"
      BROKER_CREDENTIALS_ACTIVE_KEY_VERSION: ${BROKER_CREDENTIALS_ACTIVE_KEY_VERSION:-1}
      BROKER_CREDENTIALS_KEYS_1: ${CREDENTIAL_KEY_BASE64:?set CREDENTIAL_KEY_BASE64 in Doppler}
      BROKER_TOSS_BASE_URL: ${BROKER_TOSS_BASE_URL:-https://openapi.tossinvest.com}
      BROKER_TOSS_CONNECT_TIMEOUT: ${TOSS_CONNECT_TIMEOUT:-PT2S}
      BROKER_TOSS_READ_TIMEOUT: ${TOSS_READ_TIMEOUT:-PT5S}

      # Explicit live-order boundary. Defaults fail-closed; operator approval must set
      # REAL_ORDER_ENABLED=true in Doppler. connector:trade and prepare -> submit remain required.
      REAL_ORDER_ENABLED: ${REAL_ORDER_ENABLED:-false}
      REAL_ORDER_CANARY_ENABLED: "false"

      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY in Doppler}
      GEMINI_MODEL_ID: ${GEMINI_MODEL_ID:-gemini-2.5-flash}
      GEMINI_PROMPT_VERSION: ${GEMINI_PROMPT_VERSION:-stock-analysis-explain-v1}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      GEMINI_CONNECT_TIMEOUT: ${GEMINI_CONNECT_TIMEOUT:-PT2S}
      GEMINI_READ_TIMEOUT: ${GEMINI_READ_TIMEOUT:-PT10S}
      PRODUCTION_READINESS_MAX_DATA_AGE: ${PRODUCTION_READINESS_MAX_DATA_AGE:-P7D}

      # Read-only continuous monitoring. Every switch defaults off; Doppler opts in.
      # Telegram alerts are rows in `notifications`, so NOTIFICATION_OUTBOX_ENABLED must also be true.
      MONITORING_SCHEDULER_ENABLED: ${MONITORING_SCHEDULER_ENABLED:-false}
      MONITORING_INTERVAL: ${MONITORING_INTERVAL:-PT15M}
      MONITORING_PRICE_INTERVAL: ${MONITORING_PRICE_INTERVAL:-PT10M}
      MONITORING_MACRO_INTERVAL: ${MONITORING_MACRO_INTERVAL:-PT1H}
      MARKET_EVENTS_SCHEDULER_ENABLED: ${MARKET_EVENTS_SCHEDULER_ENABLED:-false}
      MARKET_EVENTS_BATCH_SIZE: ${MARKET_EVENTS_BATCH_SIZE:-500}
      MARKET_EVENTS_MAX_EVENTS_PER_PROVIDER: ${MARKET_EVENTS_MAX_EVENTS_PER_PROVIDER:-500}
      MARKET_EVENTS_FRED_LOOKBACK: ${MARKET_EVENTS_FRED_LOOKBACK:-P45D}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_USER_ID: ${TELEGRAM_USER_ID:-}

      # Disabled until a Google service-account JSON is registered in Doppler and the sheet is shared with it.
      INVESTMENT_OS_SHEET_ENABLED: ${INVESTMENT_OS_SHEET_ENABLED:-false}
      GOOGLE_SHEETS_SPREADSHEET_ID: ${GOOGLE_SHEETS_SPREADSHEET_ID:-14GkxnY1zubBjTwtp2NB7pSDFJ4TKeYj3_3YVBzMzBQY}
      INVESTMENT_OS_SHEET_USER_ID: ${INVESTMENT_OS_SHEET_USER_ID:-}
      INVESTMENT_OS_SHEET_CONNECTION_ID: ${INVESTMENT_OS_SHEET_CONNECTION_ID:-}
      INVESTMENT_OS_SHEET_ACCOUNT_LABEL: ${INVESTMENT_OS_SHEET_ACCOUNT_LABEL:-ACCOUNT_1}
      GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON:-}

      # Spring JSON preserves dotted map keys such as quote.price and exact JSON pointers.
      SPRING_APPLICATION_JSON: >-
        {"stock-analysis":{"providers":{
        "fmp":{"enabled":true,"include-symbol-query":true,
        "base-url":"${FMP_BASE_URL:-https://financialmodelingprep.com/stable}",
        "path":"/quote","api-key":"${FMP_API_KEY:?set FMP_API_KEY in Doppler}",
        "api-key-query-parameter":"apikey",
        "as-of-path":"/0/timestamp","as-of-format":"EPOCH_SECONDS",
        "fields":{"quote.price":"/0/price","quote.volume":"/0/volume",
        "quote.change-percent":"/0/changePercentage","fundamental.marketCap":"/0/marketCap"},
        "endpoints":{
        "regular-close-history":{"path":"/historical-price-eod/full",
        "as-of-path":"/0/date","as-of-format":"DATE","price-session":"REGULAR_CLOSE",
        "fields":{"price.regularCloseHistory":""}},
        "balance-sheet":{"path":"/balance-sheet-statement",
        "query-parameters":{"period":"quarter","limit":"1"},
        "as-of-path":"/0/date","as-of-format":"DATE",
        "fields":{"fundamental.fiscalPeriod":"/0/date",
        "fundamental.reportedAt":"/0/filingDate","fundamental.cash":"/0/cashAndCashEquivalents",
        "fundamental.debt":"/0/totalDebt"}},
        "income-ttm":{"path":"/income-statement-ttm",
        "query-parameters":{"limit":"5"},
        "as-of-path":"/0/date","as-of-format":"DATE",
        "fields":{"fundamental.incomeFiscalPeriod":"/0/date",
        "fundamental.incomeReportedAt":"/0/filingDate","fundamental.fiscalYear":"/0/fiscalYear",
        "fundamental.fiscalPeriodCode":"/0/period","fundamental.revenueTTM":"/0/revenue",
        "fundamental.ebitdaTTM":"/0/ebitda","fundamental.eps":"/0/epsDiluted",
        "fundamental.dilutedShares":"/0/weightedAverageShsOutDil",
        "fundamental.incomeHistory":""}},
        "cash-flow-ttm":{"path":"/cash-flow-statement-ttm",
        "as-of-path":"/0/date","as-of-format":"DATE",
        "fields":{"fundamental.cashFlowFiscalPeriod":"/0/date",
        "fundamental.cashFlowReportedAt":"/0/filingDate","fundamental.fcfTTM":"/0/freeCashFlow"}},
        "annual-consensus":{"path":"/analyst-estimates",
        "query-parameters":{"period":"annual","page":"0","limit":"10"},
        "as-of-mode":"OBSERVED_AT",
        "fields":{"consensus.horizon":"/0/date","consensus.revenueConsensus":"/0/revenueAvg",
        "consensus.epsConsensus":"/0/epsAvg","consensus.ebitdaConsensus":"/0/ebitdaAvg"}}}},
        "alpha-vantage":{"enabled":${STOCK_ANALYSIS_ALPHA_VANTAGE_ENABLED:-false},
        "include-symbol-query":true,"base-url":"https://www.alphavantage.co",
        "path":"/query","api-key":"${ALPHA_VANTAGE_API_KEY:-}",
        "api-key-query-parameter":"apikey",
        "max-retries":0,
        "query-parameters":{"function":"EARNINGS_ESTIMATES"}},
        "fred":{"enabled":true,
        "base-url":"${FRED_BASE_URL:-https://api.stlouisfed.org}",
        "path":"/fred/series/observations","api-key":"${FRED_API_KEY:?set FRED_API_KEY in Doppler}",
        "api-key-query-parameter":"api_key",
        "query-parameters":{"series_id":"${FRED_SERIES_ID:-DFF}","file_type":"json","limit":"1","sort_order":"desc"},
        "as-of-path":"/observations/0/date","as-of-format":"DATE",
        "fields":{"macro.value":"/observations/0/value"}},
        "sec":{"enabled":true,
        "base-url":"${SEC_BASE_URL:-https://data.sec.gov}",
        "user-agent":"${SEC_USER_AGENT:?set SEC_USER_AGENT in Doppler}",
        "requests-per-window":10,"rate-limit-window":"PT1S","max-retries":0}
        }},
        "market-events":{"providers":{
        "fred":{"enabled":${MARKET_EVENTS_FRED_ENABLED:-false},
        "base-url":"${FRED_BASE_URL:-https://api.stlouisfed.org}",
        "api-key":"${FRED_API_KEY:?set FRED_API_KEY in Doppler}",
        "scopes":["DGS10","DFII10","T10YIE","BAMLH0A0HYM2","BAMLC0A0CM","SOFR","DFF","DEXJPUS","DEXKOUS","DTWEXBGS"]},
        "sec":{"enabled":${MARKET_EVENTS_SEC_ENABLED:-false},
        "base-url":"${SEC_BASE_URL:-https://data.sec.gov}",
        "user-agent":"${SEC_USER_AGENT:?set SEC_USER_AGENT in Doppler}",
        "identifiers":${MARKET_EVENTS_SEC_IDENTIFIERS_JSON:-null}}
        }}}

      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?set OIDC_CLIENT_ID in Doppler}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET in Doppler}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_OIDC_CLIENT_AUTHENTICATION_METHOD: client_secret_basic
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_OIDC_AUTHORIZATION_GRANT_TYPE: authorization_code
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_OIDC_REDIRECT_URI: ${PUBLIC_DASHBOARD_URL:?set PUBLIC_DASHBOARD_URL in Doppler}/login/oauth2/code/{registrationId}
      PUBLIC_DASHBOARD_URL: ${PUBLIC_DASHBOARD_URL:?set PUBLIC_DASHBOARD_URL in Doppler}
      SECURITY_ACCESS_TOKEN_SIGNING_SECRET: ${AUTH_TOKEN_SIGNING_SECRET:?set AUTH_TOKEN_SIGNING_SECRET in Doppler}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_OIDC_SCOPE: openid,profile,email
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_OIDC_PROVIDER: oidc
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:?set OIDC_ISSUER_URI in Doppler}
