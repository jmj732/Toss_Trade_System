name: trade-staging-credentialed

# Opt-in real-provider overlay. Load with:
#   doppler run --project trade --config staging -- \
#     docker compose -f compose.yaml -f compose.staging.yaml \
#       -f compose.staging.credentialed.yaml up -d --wait
# Never layer compose.mock.yaml onto this file. Doppler supplies values; no secret is stored here.

services:
  backend:
    environment:
      # Enables encrypted Toss onboarding only. Client credentials arrive through the
      # authenticated /api/v1/broker-connections/toss request and are never env settings.
      BROKER_CREDENTIALS_ENABLED: "true"
      BROKER_CREDENTIALS_ACTIVE_KEY_VERSION: ${BROKER_CREDENTIALS_ACTIVE_KEY_VERSION:-1}
      BROKER_CREDENTIALS_KEYS_1: ${CREDENTIAL_KEY_BASE64:?set CREDENTIAL_KEY_BASE64 in Doppler}
      BROKER_TOSS_BASE_URL: ${BROKER_TOSS_BASE_URL:-https://openapi.tossinvest.com}
      BROKER_TOSS_CONNECT_TIMEOUT: ${TOSS_CONNECT_TIMEOUT:-PT2S}
      BROKER_TOSS_READ_TIMEOUT: ${TOSS_READ_TIMEOUT:-PT5S}

      # Explicit fail-closed live-order boundary. Toss onboarding/validation does not enable it.
      REAL_ORDER_ENABLED: "false"
      REAL_ORDER_CANARY_ENABLED: "false"

      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY in Doppler}
      GEMINI_MODEL_ID: ${GEMINI_MODEL_ID:-gemini-2.5-flash}
      GEMINI_PROMPT_VERSION: ${GEMINI_PROMPT_VERSION:-stock-analysis-explain-v1}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      GEMINI_CONNECT_TIMEOUT: ${GEMINI_CONNECT_TIMEOUT:-PT2S}
      GEMINI_READ_TIMEOUT: ${GEMINI_READ_TIMEOUT:-PT10S}
      PRODUCTION_READINESS_MAX_DATA_AGE: ${PRODUCTION_READINESS_MAX_DATA_AGE:-P7D}

      # Spring JSON preserves dotted map keys such as quote.price and exact JSON pointers.
      SPRING_APPLICATION_JSON: >-
        {"stock-analysis":{"providers":{
        "fmp":{"enabled":true,"include-symbol-query":true,
        "base-url":"${FMP_BASE_URL:-https://financialmodelingprep.com/stable}",
        "path":"/quote","api-key":"${FMP_API_KEY:?set FMP_API_KEY in Doppler}",
        "api-key-query-parameter":"apikey",
        "as-of-path":"/0/timestamp","as-of-format":"EPOCH_SECONDS",
        "fields":{"quote.price":"/0/price","quote.volume":"/0/volume",
        "quote.change-percent":"/0/changePercentage"}},
        "fred":{"enabled":true,
        "base-url":"${FRED_BASE_URL:-https://api.stlouisfed.org}",
        "path":"/fred/series/observations","api-key":"${FRED_API_KEY:?set FRED_API_KEY in Doppler}",
        "api-key-query-parameter":"api_key",
        "query-parameters":{"series_id":"${FRED_SERIES_ID:-DFF}","file_type":"json","limit":"1","sort_order":"desc"},
        "as-of-path":"/observations/0/date","as-of-format":"DATE",
        "fields":{"macro.value":"/observations/0/value"}},
        "sec":{"enabled":true,
        "base-url":"${SEC_BASE_URL:-https://data.sec.gov}",
        "path":"/submissions/CIK${SEC_CIK:-0000320193}.json",
        "user-agent":"${SEC_USER_AGENT:?set SEC_USER_AGENT in Doppler}",
        "as-of-path":"/filings/recent/acceptanceDateTime/0","as-of-format":"INSTANT",
        "fields":{"filing.form":"/filings/recent/form/0",
        "filing.accession":"/filings/recent/accessionNumber/0",
        "filing.acceptance":"/filings/recent/acceptanceDateTime/0"}}
        }}}

      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?set OIDC_CLIENT_ID in Doppler}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET in Doppler}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_OIDC_CLIENT_AUTHENTICATION_METHOD: client_secret_basic
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_OIDC_AUTHORIZATION_GRANT_TYPE: authorization_code
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_OIDC_REDIRECT_URI: ${PUBLIC_DASHBOARD_URL:?set PUBLIC_DASHBOARD_URL in Doppler}/login/oauth2/code/{registrationId}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_OIDC_SCOPE: openid,profile,email
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_OIDC_PROVIDER: oidc
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:?set OIDC_ISSUER_URI in Doppler}
