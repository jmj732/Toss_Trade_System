[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trade-analysis-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.140.7",
    "pydantic==2.13.4",
    "uvicorn==0.51.0",
]

[project.optional-dependencies]
test = [
    "httpx==0.28.1",
    "pytest==9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
